###
### REPORTING: ACCOUNTS
###
[kernel]
strict = false
audit = { mode = false, hash = "SHA-256" }
timestamp = { default-time = 00:00:00, timezone = { name = "UTC" } }

[kernel.input]
storage = "fs"

[kernel.input.fs]
dir = "txns"
suffix = "txn"

[transaction]
accounts    = { path = "none" }
commodities = { path = "none" }
tags        = { path = "none" }


[report]
report-timezone = "UTC"
scale = { min = 2, max = 7 }
formats = [ "txt" ]
# test: 2fe1dd09-fefc-4a19-ad2b-03bf77c73bf5
# desc: verify that accounts selector doesn't affect account export
accounts = [ "Not:an:account", "Neither:this:one" ]
targets = [ ]

balance       = { title = "BALANCE (TEST)" }
balance-group = { title = "BALANCE GROUP (TEST)", group-by = "date" }
register      = { title = "REGISTER (TEST)" }


[export]
# test: d8193c9b-6183-4d18-b06d-76ffd8df779e
# desc: verify accounts cli override
targets = ["equity", "identity"]
equity = { equity-account = "Equity:Balance" }
